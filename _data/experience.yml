- role: Research Intern, Deep Reinforcement Learning
  org: Kyushu University
  url: https://www.kyushu-u.ac.jp/en/
  location: Fukuoka, Japan
  start: Oct 2024
  end: Mar 2025
  summary: >-
    Led a research project on autonomous multi-drone coordination in
    obstacle-rich 3D environments, moving beyond single-agent setups towards a
    scalable approach to air traffic control simulation.
  sections:
    - title: Key contributions
      items:
        - >-
          **Simulation environment**: engineered a physics-based 3D simulation
          in Unity and C#, connected to a Python training pipeline through the
          Unity ML-Agents toolkit and the PettingZoo Parallel API.
        - >-
          **Continuous control agent**: implemented a Soft Actor-Critic (SAC)
          agent under Centralised Training with Decentralised Execution (CTDE),
          with a custom centralised critic in PyTorch for coordinated policy
          learning.
        - >-
          **Reward engineering**: designed a hybrid reward that combines sparse
          terminal rewards with dense, potential-based progress rewards, plus an
          Intrinsic Curiosity Module (ICM) for exploration under sparse reward.
        - >-
          **Knowledge distillation**: distilled features from a pre-trained
          vision model (VIP) into the agent's CNN, improving state
          representations without the cost of a large network.
  outcome: >-
    The project became my MSc dissertation, where a MAPPO agent trained with a
    staged curriculum reached **99.5% success** on the hardest, cluttered level.
    [Read the case study](/projects/#mappo-drones).
  tags: [PyTorch, Unity, C#, SAC, MARL, PettingZoo, ONNX]
