- role: ML Engineer
  org: GFT Technologies SE
  url: https://www.gft.com
  location: Milan, Italy
  start: May 2020
  end: Present
  current: true
  summary: >-
    I build and operate production AI systems and lead small teams on EU
    research projects, taking systems from prototype to commercial deployment:
    retrieval and agent architecture, the backend that serves it, and the MLOps
    and evaluation that make it safe to ship.
  sections:
    - title: "Smart Compliance: RAG product for financial services"
      meta: Team lead, 4 engineers
      items:
        - >-
          Led a team of four taking a RAG compliance product from prototype to
          commercial deployment for clients in financial services, and mentored
          engineers new to machine learning on retrieval and evaluation.
        - >-
          Designed the retrieval layer: hybrid dense and lexical retrieval with
          cross-encoder reranking, structure-aware chunking, and permission
          pre-filtering inside the vector query rather than after retrieval.
        - >-
          Set up retrieval evaluation as a regression suite (faithfulness,
          context precision and recall on a curated set) that runs on every
          pipeline change before release.
        - >-
          Built the production backend in Python, FastAPI, Flask and SQLAlchemy
          with error handling, logging and monitoring, and deployed it as
          containerised microservices on GCP and Azure with GitHub Actions CI/CD.
    - title: "VIGILANCE: cybersecurity agent platform (EU)"
      meta: Task lead, 2 workstreams
      items:
        - >-
          Lead the agent repository and orchestration workstreams: multi-step
          agent workflows that use tools and produce structured outputs
          (LangGraph), backed by a Neo4j knowledge graph and Qdrant vector
          retrieval, and deployed as containerised microservices.
        - >-
          Built the evaluation harness that decides which models and agents
          reach production: trajectory-level tracing, tool-call success and
          routing precision, with promotion requiring a defined margin over the
          incumbent.
        - >-
          Built an end-to-end MLOps system: Dagster orchestration, MLflow
          tracking and model registry, staged promotion with monitoring, drift
          detection and one-step rollback.
    - title: "REAICT: Graph-RAG knowledge base"
      meta: Team lead
      items:
        - >-
          Built a centralised cultural knowledge base on a Graph-RAG
          architecture, designing the Neo4j schema (nodes, relationships and
          indexed properties) that directly governs retrieval quality.
        - >-
          Implemented the backend with FastAPI and Neo4j, and mentored junior
          developers on research projects.
    - title: "KYKLOS: industrial IoT data pipeline"
      meta: Team lead, 3 engineers
      items:
        - >-
          Led a three-person team developing a data science pipeline, extending
          the open-source StreamPipes project.
        - >-
          Built a Spring Boot and Java web application on PostgreSQL for
          pipeline configuration.
    - title: Research and EU proposals
      items:
        - >-
          Authored AI proposals securing **€2M+ across 9 EU Horizon projects**,
          and was a technical contributor to consortium bids (€45M GRAVITON,
          €35M AGENTIUM).
        - R&D partnerships with ESA, Toshiba and Philips.
  tags: [Python, FastAPI, LangGraph, Neo4j, Qdrant, Dagster, MLflow, Docker, Kubernetes, GCP, Azure]

- role: Research Intern, Deep Reinforcement Learning
  org: Kyushu University
  url: https://www.kyushu-u.ac.jp/en/
  location: Fukuoka, Japan
  start: Oct 2024
  end: Apr 2025
  summary: >-
    Multi-agent reinforcement learning for autonomous UAV corridor navigation
    in obstacle-rich 3D environments.
  sections:
    - title: Key contributions
      items:
        - >-
          Implemented MAPPO with Centralised Training and Decentralised
          Execution (CTDE) for multi-agent UAV corridor navigation, and
          benchmarked it against a SAC approach.
        - >-
          Diagnosed repeated training collapse caused by diverging value loss
          under premature entropy decay, and resolved it with adaptive
          KL-divergence entropy scheduling and a four-stage curriculum.
        - >-
          Reached **96% task success** with **1.9 times the sample efficiency**
          of the baseline (PyTorch, Unity ML-Agents, PettingZoo).
        - >-
          Built the physics-based 3D simulation in Unity and C#, connected to
          the Python training pipeline through Unity ML-Agents.
  outcome: >-
    I continued the project for my MSc dissertation. The final version reaches
    **99.5% success** on the hardest, cluttered level in deterministic
    evaluation. [Read the case study](/projects/#mappo-drones).
  tags: [PyTorch, Unity ML-Agents, PettingZoo, MAPPO, CTDE, SAC, C#]
