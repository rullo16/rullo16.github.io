  - id: mappo-drones
    title: MAPPO for Multi-Agent Drone Navigation
    badge: MSc dissertation · Kyushu University
    category: rl
    featured: true
    case_study: true
    summary: >-
      A swarm of drones learns to reach its goals through cluttered 3D airspace
      using only its own camera and sensor readings. The environment is built
      in Unity ML-Agents and the drones are trained with Multi-Agent PPO under
      Centralised Training with Decentralised Execution (CTDE).
    highlights:
      - >-
        **Algorithm**: MAPPO with GAE, a tanh-squashed Gaussian policy and
        KL-based early stopping. Actors share parameters and act on local
        observations; a centralised critic sees every agent.
      - >-
        **Curriculum**: four stages with success gates. Without it, success on
        the hardest level falls from 99.5% to 8.5%.
      - >-
        **Perception**: a compact CNN encoder, contrastively pretrained and
        frozen during RL, adds 13 points on the cluttered level over a random
        encoder.
      - >-
        **Baselines**: an MPPI controller with a learned dynamics model and a
        privileged proportional controller that is handed the goal direction.
      - >-
        **Engineering**: independent per-agent episodes through the low-level
        ML-Agents API, training health monitors that abort stalled runs, a
        pytest suite in CI and Weights & Biases logging.
    story: >-
      An earlier 2.39M-step run reached only 2% success. The post-mortem found
      an oversized entropy bonus, a curiosity module trained on misaligned
      pairs, a vision checkpoint that silently failed to load, a curriculum
      gate that could never trigger, and a progress reward that paid drones to
      oscillate in place. Fixing those bugs, making the reward potential-based
      and symmetric, giving each drone its own goal and letting episodes end
      independently took the hardest level to 99.5%. The first iteration,
      SAC with VIP feature distillation, is kept in the repository for
      reference.
    tags: [MAPPO, CTDE, Curriculum learning, Unity ML-Agents, PyTorch, W&B]
    links:
      - label: Code
        url: https://github.com/rullo16/MAPPO_Drones
      - label: Full results
        url: https://github.com/rullo16/MAPPO_Drones/blob/master/RESULTS.md

  - id: smart-compliance
    title: "Smart Compliance: RAG for Financial Services"
    badge: GFT product · Team lead, 4 engineers
    category: agents
    featured: true
    summary: >-
      A retrieval-augmented generation product that automates compliance
      checks for financial-services clients. I led the team that
      fast-prototyped it and took it to commercial deployment, and mentored
      engineers new to machine learning on retrieval and evaluation.
    highlights:
      - >-
        **Retrieval**: hybrid dense and lexical retrieval with cross-encoder
        reranking, structure-aware chunking, and permission pre-filtering inside
        the vector query rather than after retrieval.
      - >-
        **Evaluation**: a retrieval regression suite (faithfulness, context
        precision and recall on a curated set) that runs on every pipeline
        change before release.
      - >-
        **Backend**: Python, FastAPI, Flask and SQLAlchemy with error handling,
        logging and monitoring, shipped as containerised microservices on GCP
        and Azure through GitHub Actions CI/CD.
    tags: [RAG, Hybrid retrieval, Reranking, FastAPI, SQLAlchemy, GCP, Azure]

  - id: vigilance
    title: "VIGILANCE: Cybersecurity Agent Platform"
    badge: EU project · Task lead, 2 workstreams
    category: agents
    featured: true
    summary: >-
      An EU-funded Zero Trust cybersecurity platform. I lead the agent
      repository and orchestration workstreams: multi-step agent workflows that
      use tools and produce structured outputs, built with LangGraph on a Neo4j
      knowledge graph and Qdrant vector retrieval.
    highlights:
      - >-
        **Evaluation harness**: decides which models and agents reach
        production, with trajectory-level tracing, tool-call success and
        routing precision. Promotion needs a defined margin over the incumbent.
      - >-
        **MLOps**: Dagster orchestration, MLflow tracking and model registry,
        staged promotion with monitoring, drift detection and one-step
        rollback.
      - >-
        **Knowledge**: threat-intelligence standards (STIX 2.1, TAXII, MITRE
        ATT&CK) in the graph, with RotatE graph embeddings and SecureBERT for
        domain text.
      - Agents run as containerised microservices.
    tags: [LangGraph, Neo4j, Qdrant, Dagster, MLflow, Docker]

  - id: reaict
    title: "REAICT: Graph-RAG Knowledge Base"
    badge: Team lead
    category: agents
    featured: true
    summary: >-
      A centralised cultural knowledge base built on a Graph-RAG architecture.
    highlights:
      - >-
        Designed the Neo4j schema: the nodes, relationships and indexed
        properties that directly govern retrieval quality.
      - >-
        Built the backend with FastAPI and Neo4j, and mentored junior
        developers on the project.
    tags: [Graph-RAG, Neo4j, FastAPI]

  - id: kyklos
    title: "KYKLOS: Industrial IoT Data Pipeline"
    badge: Team lead, 3 engineers
    category: data
    summary: >-
      Led a three-person team developing a data science pipeline for
      industrial IoT data.
    highlights:
      - Extended the open-source StreamPipes project.
      - Built a Spring Boot and Java web application on PostgreSQL for pipeline configuration.
    tags: [StreamPipes, Spring Boot, Java, PostgreSQL]

  - id: nlp
    title: "NLP: Sexism Detection & Biomedical Knowledge Graphs"
    category: nlp
    summary: >-
      Two NLP pipelines: detecting sexist content in social media posts, and
      turning biomedical text into a queryable knowledge graph.
    highlights:
      - >-
        **Sexism detection**: a BiLSTM + Twitter-RoBERTa ensemble and
        Mistral-7B prompting for detecting sexist content in social media
        posts.
      - >-
        **Biomedical KG extraction**: an end-to-end pipeline with GLiNER2 for
        named entities, REBEL for relations, BioBERT embeddings and a Kùzu
        graph database, built for a University of Bologna collaboration.
    tags: [Hugging Face, BiLSTM, RoBERTa, Mistral-7B, GLiNER2, Kùzu]

