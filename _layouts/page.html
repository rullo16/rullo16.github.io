---
layout: default
---
<header class="page-head">
  <div class="container">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-head__title">{{ page.heading | default: page.title }}</h1>
    {%- if page.intro %}<p class="lede">{{ page.intro }}</p>{% endif %}
  </div>
</header>
<div class="container page-body">
  {{ content }}
</div>
