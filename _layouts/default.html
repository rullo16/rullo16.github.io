<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% seo %}
  </head>

  <body>
    <header>
      <div class="wrapper">
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
      </div>
    </header>

    <nav>
      <ul>
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/experience/' | relative_url }}">Experience</a></li>
        <li><a href="{{ '/projects/' | relative_url }}">Projects</a></li>
        <li><a href="{{ '/skills/' | relative_url }}">Skills</a></li>
        <li><a href="{{ '/education/' | relative_url }}">Education</a></li>
        <li><a href="{{ '/picture/' | relative_url }}">Picture</a></li>
        <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
      </ul>
    </nav>

    <main>
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer>
      <div class="wrapper">
        <p>&copy; 2025 Federico Rullo. All rights reserved.</p>
        <p>
          <a href="mailto:{{ site.email }}">Email</a> |
          <a href="https://github.com/rullo16" target="_blank">GitHub</a> |
          <a href="https://linkedin.com/in/federico-rullo-683677145" target="_blank">LinkedIn</a>
        </p>
      </div>
    </footer>
  </body>
</html>
