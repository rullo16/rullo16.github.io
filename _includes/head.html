<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* Apply the saved theme before first paint so the page never flashes. */
  (function () {
    var root = document.documentElement, saved = null;
    root.classList.add('js');
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
  })();
</script>
{% seo %}
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap">
{%- assign build = site.time | date: '%s' %}
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ build }}">
<script src="{{ '/assets/js/main.js' | relative_url }}?v={{ build }}" defer></script>
{%- if page.scripts %}
{%- for script in page.scripts %}
<script src="{{ script | relative_url }}?v={{ build }}" defer></script>
{%- endfor %}
{%- endif %}
